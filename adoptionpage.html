<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>Puppy Adoption Page</h1>
<h2><strong>Please enter your information to adopt a puppy and we'll email you back.</strong></h2>
<p>Please note: First name, Last name, Password, and Email are required</p>
<form>
<!--I decided to put the label tag first instead of a paragraph tag -->
<label for="fname">First Name:</label>
<input type = "text" id="fname" name="fname" value="First name">
<label for="lname">Last Name:</label>
<input type="text" id="lname" name="lname" value="Last Name">
<p>
<label for="email">Email:</label>
<input type="text" id="email" name="email" value="name@email.com">
<label for="password">Password:</label>
<input type="text" id="password" name="password">
</p>
<p>Are you over the age of 18?</p>
<p>
<label for="yes">Yes:</label>
<input type ="radio" id="yes" name="yes">
<label for="no">No:</label>
<input type="radio" id="no" name="no">
</p>
<p>Do you have a Credit Card or Paypal?</p>
<p>
<label for="payment"></label>
<select name="payment" id="payment">
    <option value="Credit Card">Credit Card</option>
    <option value="PayPal">PayPal</option>
</select>
</p>
<p>
<input type="submit" id="submit" name="submit" value="Submit feedback">
</p>
</form>
</body>
</html>
